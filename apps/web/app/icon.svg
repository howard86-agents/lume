<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lume favicon / vector app icon.

  Drawn at a 96-unit viewBox so it scales cleanly to every favicon and
  manifest size. The composition mirrors the cover halo: a deep aurora
  base, a soft amber/violet halo, and a luminous core "L" mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Lume">
  <defs>
    <radialGradient id="lume-icon-halo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffce7a" stop-opacity="0.78" />
      <stop offset="45%" stop-color="#b390ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lume-icon-core" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#fff5e0" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#ffb755" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#7a3a00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lume-icon-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0d18" />
      <stop offset="100%" stop-color="#08080d" />
    </linearGradient>
  </defs>
  <!-- Rounded square base. Maskable-safe: keeps important content in the
       inner 80% of the canvas. -->
  <rect x="0" y="0" width="96" height="96" rx="20" fill="url(#lume-icon-base)" />
  <circle cx="48" cy="48" r="44" fill="url(#lume-icon-halo)" />
  <circle cx="48" cy="48" r="20" fill="url(#lume-icon-core)" />
  <circle cx="48" cy="48" r="6" fill="#fff5e0" fill-opacity="0.95" />
</svg>
