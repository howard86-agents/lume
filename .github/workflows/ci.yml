name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup (Bun + caches + install)
        uses: howard86/actions/setup@a99a85ee8cbe78d34e8f5e79bfd24db64fc9b112 # v1.0.0

      - name: Lint (ultracite)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: bun run test:e2e

      - name: Quality (typos, gitleaks, actionlint)
        uses: howard86/actions/quality@a99a85ee8cbe78d34e8f5e79bfd24db64fc9b112 # v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
